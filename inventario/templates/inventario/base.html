{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo_pagina %}Supermercado{% endblock %}</title>
    <!-- Bootstrap 5 para diseño responsive -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'inventario/css/estilos.css' %}">
</head>
<body>

<!-- Barra de navegación principal -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container-fluid px-3 px-md-4">
        <span class="navbar-brand fs-3 fw-bold d-flex align-items-center gap-2">
            <span aria-hidden="true">🛒</span> Mi Supermercado
        </span>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navPrincipal" aria-controls="navPrincipal" aria-expanded="false" aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navPrincipal">
            <div class="navbar-nav ms-auto flex-row flex-wrap gap-2 mt-3 mt-lg-0">
                <a class="nav-link btn btn-nav {% if request.resolver_match.url_name == 'facturacion' %}active{% endif %}"
                   href="{% url 'inventario:facturacion' %}">
                    Vender
                </a>
                <a class="nav-link btn btn-nav {% if 'inventario' in request.path and 'historial' not in request.path %}active{% endif %}"
                   href="{% url 'inventario:lista_inventario' %}">
                    Inventario
                </a>
                <a class="nav-link btn btn-nav {% if 'historial' in request.path %}active{% endif %}"
                   href="{% url 'inventario:historial_ventas' %}">
                    Historial
                </a>
            </div>
        </div>
    </div>
</nav>

<main class="container-fluid px-3 px-md-4 pb-5">
    {% block contenido %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
            navigator.serviceWorker.register("{% url 'service_worker' %}")
                .catch(function (error) {
                    console.warn('No se pudo registrar el Service Worker:', error);
                });
        });
    }
</script>
{% block scripts_extra %}{% endblock %}
</body>
</html>
